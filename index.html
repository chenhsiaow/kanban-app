<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>看板</h1>
      <p>把卡片拖到不同欄位，或新增一張任務。</p>
    </header>

    <main class="board" id="board">
      <section class="column" data-column="todo">
        <header class="column-header">
          <h2>待辦</h2>
          <span class="count" data-count>0</span>
        </header>
        <div class="cards" data-cards></div>
        <form class="add-card" data-add>
          <input type="text" name="title" placeholder="新增卡片…" required />
          <input type="date" name="due" aria-label="截止日期" />
          <button type="submit">加入</button>
        </form>
      </section>

      <section class="column" data-column="doing">
        <header class="column-header">
          <h2>進行中</h2>
          <span class="count" data-count>0</span>
        </header>
        <div class="cards" data-cards></div>
        <form class="add-card" data-add>
          <input type="text" name="title" placeholder="新增卡片…" required />
          <input type="date" name="due" aria-label="截止日期" />
          <button type="submit">加入</button>
        </form>
      </section>

      <section class="column" data-column="done">
        <header class="column-header">
          <h2>完成</h2>
          <span class="count" data-count>0</span>
        </header>
        <div class="cards" data-cards></div>
        <form class="add-card" data-add>
          <input type="text" name="title" placeholder="新增卡片…" required />
          <input type="date" name="due" aria-label="截止日期" />
          <button type="submit">加入</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
